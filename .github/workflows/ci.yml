name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Testes & Hardening
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar migrações com Alembic
        env:
          DATABASE_URL: sqlite:///./test_recrutamento.db
        run: alembic upgrade head

      - name: Executar testes automatizados
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-123456789
          APP_ENV: test
          DATABASE_URL: sqlite:///./test_recrutamento.db
          ADMIN_EMAILS: admin@empresa.com
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Instalar dependências do Frontend
        run: npm ci

      - name: Compilar build de produção
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
