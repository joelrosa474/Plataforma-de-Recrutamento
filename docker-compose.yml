version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: rh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rh_user
      POSTGRES_PASSWORD: rh_password_123
      POSTGRES_DB: rh_recrutamento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rh_user -d rh_recrutamento"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh_backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://rh_user:rh_password_123@db:5432/rh_recrutamento
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-secret-temporaria-docker-troque-em-producao-123}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@empresa.com}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: rh_webapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
